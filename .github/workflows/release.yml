name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check release tag and versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Require a tag matching every package version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow on an existing vVERSION tag, not a branch.')
          versions = {
              'rust/Cargo.toml': tomllib.loads(Path('rust/Cargo.toml').read_text())['workspace']['package']['version'],
              'python/pyproject.toml': tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version'],
              'python/Cargo.toml': tomllib.loads(Path('python/Cargo.toml').read_text())['package']['version'],
              'js/package.json': json.loads(Path('js/package.json').read_text())['version'],
          }
          if any(os.environ['GITHUB_REF_NAME'] != 'v' + version for version in versions.values()):
              raise SystemExit('Tag must equal v plus every package version: ' + repr(versions))
          print('Tag matches all four package versions.')
          PY

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
          - os: macos-26
            target: aarch64-apple-darwin
            manylinux: 'off'
          - os: macos-26-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Remap native build paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          roots = [(os.environ['GITHUB_WORKSPACE'], '/src'), (os.environ.get('CARGO_HOME', str(Path.home() / '.cargo')), '/cargo')]
          flags = ' '.join('--remap-path-prefix=' + spelling + '=' + target
                           for source, target in roots for spelling in dict.fromkeys((source, Path(source).as_posix())))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RUSTFLAGS=' + flags + '\n')
          PY
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          # The manylinux container has a different cargo home from its host.
          before-script-linux: |
            export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
      - name: Install the wheel and test it on its native platform
        env:
          ZERO_TALK_MODEL_DIR: ${{ github.workspace }}/rust/crates/zero-talk-model-11m/data
        run: |
          python -m pip install python/dist/*.whl
          python -m unittest discover -s python/tests -v
      - name: Check the exact wheel before uploading
        run: |
          python .github/scripts/check-artifacts.py python/dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - name: Check the exact sdist before uploading
        run: |
          python .github/scripts/check-artifacts.py python/dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  packages:
    name: Check Rust and npm packages
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Remap Rust build paths
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"
      - name: Test and package the Rust workspace
        working-directory: rust
        run: |
          cargo test --release --workspace
          cargo package --locked -p zero-talk-model-11m -p zero-talk
      - name: Test and pack npm
        working-directory: js
        run: |
          npm test
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - name: Check packages and the Rust executable
        run: |
          python3 .github/scripts/check-artifacts.py rust/target/package/*.crate rust/target/release/zero-talk "$RUNNER_TEMP/npm"/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-packages
          path: rust/target/package/*.crate
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist, packages]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Resume a partial upload from the reviewed files
        id: remaining
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          files = {path.name: path for path in Path("dist").iterdir() if path.is_file()}
          if not files:
              raise SystemExit("No reviewed Python files found.")
          try:
              with urlopen(f"https://pypi.org/pypi/zero-talk/{version}/json", timeout=30) as response:
                  uploaded = json.load(response)["urls"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              uploaded = []
          for entry in uploaded:
              path = files.pop(entry["filename"], None)
              if (path is None or entry["yanked"] or
                      hashlib.sha256(path.read_bytes()).hexdigest() != entry["digests"]["sha256"]):
                  raise SystemExit("An existing PyPI file differs from the reviewed release.")
              path.unlink()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("upload=" + str(bool(files)).lower(), file=output)
          PYTHON
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.remaining.outputs.upload == 'true'
        with:
          attestations: true

  npm:
    name: Publish to npm
    needs: [wheels, sdist, packages]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Publish the reviewed tarball
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ github.ref_name == 'v1.0.0' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v1.0.0 ]]; then
            : "${NODE_AUTH_TOKEN:?Set NPM_BOOTSTRAP_TOKEN in the release environment}"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/first-publish.npmrc"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish --registry=https://registry.npmjs.org --provenance --access public "$RUNNER_TEMP/npm"/*.tgz

  crates:
    name: Publish to crates.io
    needs: [wheels, sdist, packages]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-packages
          path: ${{ runner.temp }}/crates
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: github.ref_name != 'v1.0.0'
        id: auth
      - name: Publish the reviewed crates in dependency order
        env:
          REVIEWED_CRATES: ${{ runner.temp }}/crates
          PUBLISH_TOKEN: ${{ github.ref_name == 'v1.0.0' && secrets.CRATES_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: python3 .github/scripts/publish-crates.py
