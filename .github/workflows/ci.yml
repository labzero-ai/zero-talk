# Builds and tests the three packages. Nothing here publishes.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # Build paths in panic messages and debug info read /src, not the runner's folders.
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cargo test --release --workspace
      - name: Check crate packaging
        if: matrix.os == 'ubuntu-24.04'
        run: cargo package --workspace
      - name: Speak three texts (sha256 of the WAV; macOS 15 on Apple silicon gives 5289bd29…, 9d258fd6…, b71eb1fe…)
        run: |
          i=0
          for t in "Hello." "It opened on the 20th of February in 1940, and 48 people came." 'Built in 1998, it weighs 84.7 kilograms and costs $1,090.61.'; do
            i=$((i + 1))
            ./target/release/zero-talk "$t" -o "out$i.wav"
            sha256sum "out$i.wav" | tee -a "$GITHUB_STEP_SUMMARY"
            # Annotations are public on a public repository; logs need a sign-in.
            echo "::notice title=out$i.wav sha256::$(sha256sum "out$i.wav" | cut -d' ' -f1)"
          done

  wasm:
    name: engine.wasm is what the sources build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install the toolchain that build.sh pins
        run: |
          toolchain=$(sed -n 's/^TOOLCHAIN=//p' rust/crates/zero-talk-wasm/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
      - name: Rebuild js/dist/engine.wasm and compare it with the file and model.json
        run: rust/crates/zero-talk-wasm/build.sh --check

  docs:
    name: README facts match the code and the release set-up
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python3 .github/scripts/check-docs.py

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-26]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel (abi3; manylinux on Linux)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
      - name: Install the wheel and run the tests
        shell: bash
        env:
          ZERO_TALK_MODEL_DIR: ${{ github.workspace }}/rust/crates/zero-talk-model-11m/data
        run: |
          python -m pip install --quiet python/dist/*.whl
          python -m unittest discover -s python/tests
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  js:
    name: js (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check npm packaging
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: npm pack --dry-run
