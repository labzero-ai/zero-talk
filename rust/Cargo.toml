[workspace]
resolver = "2"
members = ["crates/zero-talk", "crates/zero-talk-model-11m", "crates/zero-talk-wasm"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://labzero.ai/zero-talk-11m/"
repository = "https://github.com/labzero-ai/zero-talk"
rust-version = "1.88"

# Privacy: strip symbols and abort on panic. Stable Cargo does not yet support profile trim-paths.
# Remap both source and dependency paths for release builds:
#   RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$PWD=/src" cargo build --release
[profile.release]
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1

# The Opus encoder is built for size: 331 KB smaller than at opt-level 3, with the same output.
[profile.release.package.opus-pure]
opt-level = "s"
