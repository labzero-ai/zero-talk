[package]
name = "zero-talk"
description = "Zero Talk 11M: a small English text-to-speech model, its engine and the zero-talk command"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
rust-version.workspace = true
keywords = ["text-to-speech", "tts", "speech", "audio", "ogg"]
categories = ["multimedia::audio", "command-line-utilities"]
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]

[lib]
name = "zero_talk"
path = "src/lib.rs"

[[bin]]
name = "zero-talk"
path = "src/main.rs"

[features]
default = ["embed", "accelerate"]
# The model and the text front end are built into the program, so Voice::load needs no files. Without it, give the files to
# Voice::from_files.
embed = ["dep:zero-talk-model-11m"]
# macOS only (on by default, and without effect elsewhere): Apple's Accelerate framework as the matrix backend, which is the
# default there and about 3-4x faster. The command's --backend portable selects the pure Rust one. The two give results that differ
# slightly, by floating-point rounding.
accelerate = []

[dependencies]
# Pure Rust matrix products with runtime-detected AVX2/FMA, AVX-512 and NEON kernels.
matrixmultiply = "0.3.11"
# Pure Rust Opus encoder (a port of libopus, BSD-3-Clause).
opus-pure = "0.2.2"
zero-talk-model-11m = { version = "1.0.0", path = "../zero-talk-model-11m", optional = true }
